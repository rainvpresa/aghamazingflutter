name: aghamazing
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.5
  lottie: ^3.3.2
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # include the entire pngs folder so all images inside are bundled
  assets:
    - assets/images/pngs/
    - assets/images/backgrounds/
    - assets/images/avatars/
    - assets/animations/
    - assets/config/