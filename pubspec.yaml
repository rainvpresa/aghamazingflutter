name: aghamazing1
description: "AGHAMazing App by CTRL+DEV"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.5
  lottie: ^3.3.2
  http: ^1.6.0                      # Used for Laravel REST API calls
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2       # Used for storing Sanctum Bearer token locally
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1
  intl: ^0.18.1
  confetti: ^0.7.0
  url_launcher: ^6.3.0
  google_fonts: ^8.2.0
  audioplayers: ^6.7.1
  path_provider: ^2.1.3
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf

  assets:
    - assets/images/pngs/
    - assets/images/backgrounds/
    - assets/images/avatars/
    - assets/animations/
    - assets/config/
    - assets/images/jpgs/
    - assets/audio/
    - assets/terms_and_conditions.md

flutter_launcher_icons:
  android: true
  image_path: "assets/images/pngs/aghamazing_icon.png"